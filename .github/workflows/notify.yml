name: Buddha Noti

on:
  # GitHub Actions cron disabled — free-tier schedules fire 6-12h late.
  # Notifications are triggered by external scheduler (cron-job.org) calling
  # the workflow_dispatch API on time (±1 min). See README.
  # To restore native GitHub cron, uncomment the schedule block below.
  # schedule:
  #   - cron: "30 22 * * *"   # 05:30 ICT next day
  #   - cron: "0 13 * * *"    # 20:00 ICT same day

  workflow_dispatch:
    inputs:
      mode:
        description: "Notification mode"
        required: true
        type: choice
        options:
          - morning
          - evening
      dry_run:
        description: "Dry run (no LINE message sent)"
        required: false
        type: boolean
        default: true
      date_override:
        description: "Override date (YYYY-MM-DD) for testing"
        required: false
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
            echo "dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 22 * * *" ]; then
            echo "mode=morning" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          else
            echo "mode=evening" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Run notification
        env:
          PYTHONIOENCODING: utf-8
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'anthropic/claude-sonnet-4.5' }}
          DATE_OVERRIDE: ${{ inputs.date_override }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: |
          DRY_FLAG="--no-dry-run"
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python src/main.py --mode ${{ steps.mode.outputs.mode }} $DRY_FLAG

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
